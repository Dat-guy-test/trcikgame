name = "tarok-server"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# One Durable Object per room (SQLite-backed, which is what the free plan supports).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# An ORIGIN is scheme + host only (no path): the GitHub Pages site, not the repository URL.
# Comma-separate several; "*" allows everything (fine for a first test).
ALLOWED_ORIGIN = "https://dat-guy-test.github.io"
